name: Build Standalone Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Expo doctor
        run: npx expo-doctor || true

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build standalone release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/BrightPath-Tutor-Standalone.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrightPath-Tutor-Standalone-APK
          path: dist/BrightPath-Tutor-Standalone.apk
          if-no-files-found: error
          retention-days: 30
